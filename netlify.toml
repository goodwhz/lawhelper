# Netlify 部署配置

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"
  NPM_FLAGS = "--legacy-peer-deps"

# Next.js 路由支持
[[redirects]]
  from = "/_next/*"
  to = "/_next/:splat"
  status = 200

# API 函数重定向(确保Next.js API路由正常工作)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# 静态资源缓存
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# API函数的超时配置(Netlify函数超时)
[functions]
  timeout = 60
  node_bundler = "esbuild"

# 特定API函数配置
[functions."/api/coze/*"]
  timeout = 90

[functions."/api/spark-evaluator/*"]
  timeout = 90

[functions."/api/dify/*"]
  timeout = 90
