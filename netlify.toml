# Netlify 部署配置

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"
  NPM_FLAGS = "--legacy-peer-deps"

# Next.js 路由支持
[[redirects]]
  from = "/_next/*"
  to = "/_next/:splat"
  status = 200

# 兼容旧 API 路径的拼写错误 (临时方案)
[[redirects]]
  from = "/api/spark-evlaator/:splat"
  to = "/api/spark-evaluator/:splat"
  status = 301

# 静态资源缓存
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
